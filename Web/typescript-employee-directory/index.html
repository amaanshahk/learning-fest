<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A TypeScript-powered employee directory with search.">
    <title>Employee Directory | LF 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <p class="eyebrow">LEARNING FEST 2026</p>
        <h1>Employee Directory</h1>
        <p>Find people, roles, and departments in one place.</p>
    </header>

    <main class="container">
        <section class="toolbar">
            <div>
                <h2>Our People</h2>
                <p id="employee-count">Loading employees...</p>
            </div>

            <label class="search-box">
                <span>Search employees</span>
                <input
                    id="search-input"
                    type="search"
                    placeholder="Name, role, department or μID"
                    autocomplete="off"
                >
            </label>
        </section>

        <p id="empty-state" hidden>No matching employees found.</p>
        <section id="employee-list" class="employee-grid"
                 aria-live="polite"></section>
    </main>

    <footer>
        <p>Built with TypeScript · LF 2026 Web Dev 6</p>
        <p>μID: amaanshahk@mulearn</p>
    </footer>

    <script type="module" src="./dist/main.js"></script>
</body>
</html>
